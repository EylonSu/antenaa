name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller

      - name: Fetch USB serial drivers
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./installer/windows/drivers/fetch_drivers.ps1

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y

      - name: Install create-dmg
        if: runner.os == 'macOS'
        run: brew install create-dmg

      - name: Build
        run: python scripts/build.py

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: AntennaTracker-windows-setup
          path: dist/*-setup.exe

      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: AntennaTracker-macos-dmg
          path: dist/*.dmg
