<!DOCTYPE html>
<html dir="ltr" lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="vendor/leaflet.css">
<script src="vendor/leaflet.js"></script>
<script src="vendor/three.min.js"></script>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<style>
  html, body, #map { height: 100%; margin: 0; padding: 0; background: #05080e; direction: ltr; }
  .ant3d { background: none; border: none; }
  .ant3d canvas { display: block; }
  .ant-icon { font-size: 34px; line-height: 34px; text-align: center; }
  .drone-icon { text-align: center; cursor: grab; background: none; border: none; }
  .drone-icon img { width: 34px; height: 34px; display: block; }
  .basemap-toggle { display: flex; align-items: stretch; background: #0a111c; border: 1px solid #1d2b42;
                    border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.35);
                    font: 600 12px/32px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overflow: hidden; }
  .basemap-toggle a { padding: 0 12px; color: #7f93ab; text-decoration: none; background: #0a111c; }
  .basemap-toggle a.active { background: #46d9ff; color: #04121c; font-weight: 800; }
  .basemap-toggle span { display: none; }
  .leaflet-bar { border: 1px solid #1d2b42 !important; border-radius: 8px !important; overflow: hidden; }
  .leaflet-bar a { color: #e9eff7 !important; background: #0a111c !important; border-color: #1d2b42 !important; }
  .leaflet-control-attribution { color: #7f93ab; background: rgba(5,8,14,.85) !important; }
  .leaflet-control-attribution a { color: #46d9ff; }
  .leaflet-tile-pane { filter: none; }
  .leaflet-container img.leaflet-tile { mix-blend-mode: normal; filter: brightness(.48) saturate(.62) hue-rotate(168deg); }
  .leaflet-overlay-pane { filter: none; }
  svg.leaflet-zoom-animated { will-change: auto; }
  #offline { position: absolute; top: 40%; width: 100%; text-align: center;
             font: 20px sans-serif; color: #555; display: none; }
</style>
</head>
<body>
<div id="map"></div>
<div id="offline"></div>
<script>
var I18N = {
  en: {
    offline: "Map could not load (no internet?)",
    map: "Map",
    satellite: "Satellite",
    lastKnown: "last known"
  },
  he: {
    offline: "המפה לא נטענה (אין אינטרנט?)",
    map: "מפה",
    satellite: "לוויין",
    lastKnown: "מיקום אחרון"
  }
};
function pageLang() {
  return new URLSearchParams(window.location.search).get("lang") === "he" ? "he" : "en";
}
function tr(key) {
  var pack = I18N[pageLang()] || I18N.en;
  return pack[key] || I18N.en[key];
}
document.documentElement.lang = pageLang();
document.getElementById("offline").textContent = tr("offline");
var bridge = null;
var map = null;
var antenna = null, drone = null, outer = null, inner = null, recLine = null, actLine = null;
var layers = null, baseLayer = null, toggleRoot = null;

function icon(cls, glyph) {
  return L.divIcon({ className: cls, html: glyph, iconSize: [34, 34], iconAnchor: [17, 17] });
}

function droneIcon() {
  return L.divIcon({ className: "drone-icon", html: '<img src="drone.png" alt="">',
                     iconSize: [34, 34], iconAnchor: [17, 17] });
}

var turret = null;
var TS = 110;
function buildTurret() {
  if (typeof THREE === "undefined") return null;
  var canvas = document.createElement("canvas");
  var renderer;
  try { renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true, preserveDrawingBuffer: true }); }
  catch (e) { return null; }
  renderer.setPixelRatio(window.devicePixelRatio || 1);
  renderer.setSize(TS, TS, false);
  canvas.style.width = TS + "px"; canvas.style.height = TS + "px";
  var scene = new THREE.Scene();
  var cam = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
  cam.position.set(0, 7.4, 6.2); cam.lookAt(0, 0.7, 0);
  scene.add(new THREE.HemisphereLight(0xcfe3ff, 0x1a1f2a, 1.1));
  var dl = new THREE.DirectionalLight(0xffffff, 1.4); dl.position.set(-3, 6, 4); scene.add(dl);
  var body = new THREE.MeshStandardMaterial({ color: 0x2b2f36, roughness: 0.55, metalness: 0.3 });
  var gearMat = new THREE.MeshStandardMaterial({ color: 0x15171b, roughness: 0.6, metalness: 0.5 });
  var lineMat = new THREE.LineBasicMaterial({ color: 0x8fa3bd, transparent: true, opacity: 0.55 });
  function mesh(geo, mat, parent, edges) {
    var m = new THREE.Mesh(geo, mat || body);
    if (edges !== false) m.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo, 30), lineMat));
    parent.add(m); return m;
  }
  var base = new THREE.Group(); scene.add(base);
  var plate = mesh(new THREE.BoxGeometry(2.6, 0.22, 1.7), null, base); plate.position.y = 0.11;
  [-1, 1].forEach(function (s) {
    var side = mesh(new THREE.BoxGeometry(0.16, 0.9, 1.1), null, base); side.position.set(s * 0.8, 0.67, 0);
    var motor = mesh(new THREE.BoxGeometry(0.5, 0.4, 0.4), null, base); motor.position.set(s * 1.15, 0.42, 0.45);
  });
  var back = mesh(new THREE.BoxGeometry(1.6, 0.9, 0.12), null, base); back.position.set(0, 0.67, -0.55);
  function gear(r, h, parent) {
    var g = new THREE.Group();
    var cone = new THREE.CylinderGeometry(r * 0.55, r, h, 20); cone.rotateZ(Math.PI / 2);
    mesh(cone, gearMat, g, false);
    for (var i = 0; i < 14; i++) {
      var t = new THREE.Mesh(new THREE.BoxGeometry(h * 0.9, 0.06, 0.07), gearMat);
      var a = i / 14 * Math.PI * 2, rr = r * 0.8;
      t.position.set(0, Math.cos(a) * rr, Math.sin(a) * rr); t.rotation.x = -a; g.add(t);
    }
    parent.add(g); return g;
  }
  var gl = gear(0.45, 0.35, base); gl.position.set(-0.55, 0.8, 0.1);
  var gr = gear(0.45, 0.35, base); gr.position.set(0.55, 0.8, 0.1); gr.rotation.y = Math.PI;
  var yaw = new THREE.Group(); yaw.position.y = 1.15; base.add(yaw);
  var mast = mesh(new THREE.CylinderGeometry(0.16, 0.2, 0.7, 16), null, yaw); mast.position.y = 0.35;
  var collar = mesh(new THREE.CylinderGeometry(0.2, 0.34, 0.2, 16), null, yaw); collar.position.y = 0.1;
  var pitch = new THREE.Group(); pitch.position.y = 0.8; yaw.add(pitch);
  mesh(new THREE.BoxGeometry(2.3, 0.28, 0.28), null, pitch);
  [-1, 1].forEach(function (s) {
    var sh = new THREE.Shape();
    sh.moveTo(-0.9, -0.85); sh.lineTo(-0.9, 0.85); sh.lineTo(1.3, 0); sh.closePath();
    [-0.35, 0.1].forEach(function (u) {
      var h = new THREE.Path(); h.absellipse(-0.45 + u * 0.4, 0.15, 0.04, 0.2, 0, Math.PI * 2, false); sh.holes.push(h);
    });
    var geo = new THREE.ExtrudeGeometry(sh, { depth: 0.06, bevelEnabled: false });
    var p = mesh(geo, null, pitch); p.rotation.y = Math.PI / 2; p.position.x = s * 1.15 - 0.03;
  });
  var t = { renderer: renderer, scene: scene, cam: cam, canvas: canvas, base: base, yaw: yaw, pitch: pitch, gl: gl, gr: gr,
            cur: null, tgt: null, raf: 0 };
  return t;
}
function wrapPi(a) { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; }
function turretStep() {
  var t = turret; t.raf = 0;
  var c = t.cur, g = t.tgt, k = 0.18, busy = false;
  ["base", "yaw", "pitch", "gl", "gr"].forEach(function (n) {
    var d = n === "base" || n === "yaw" ? wrapPi(g[n] - c[n]) : g[n] - c[n];
    if (Math.abs(d) > 0.002) { c[n] += d * k; busy = true; } else c[n] = g[n];
  });
  t.base.rotation.y = c.base; t.yaw.rotation.y = c.yaw; t.pitch.rotation.x = c.pitch;
  t.gl.rotation.x = c.gl; t.gr.rotation.x = c.gr;
  t.renderer.render(t.scene, t.cam);
  if (busy) t.raf = requestAnimationFrame(turretStep);
}
function paintTurret() {
  if (!turret) return;
  turret.renderer.render(turret.scene, turret.cam);
}
function setTurretPose(refAz, az, el, pan, tilt) {
  if (!turret) return;
  var R = Math.PI / 180;
  var ip = 180 - pan, it = 180 - tilt;
  var tgt = { base: -refAz * R, yaw: -(pan - 90) * R, pitch: el * R,
              gl: (ip + it - 90) * R, gr: (ip - it + 90) * R };
  if (!turret.cur) turret.cur = { base: tgt.base, yaw: tgt.yaw, pitch: tgt.pitch, gl: tgt.gl, gr: tgt.gr };
  turret.tgt = tgt;
  if (!turret.raf) turret.raf = requestAnimationFrame(turretStep);
}

function zoomScaleOn() {
  return new URLSearchParams(window.location.search).get("zoomscale") === "1";
}
function applyTurretScale() {
  if (!turret || !map || !zoomScaleOn()) return;
  var f = Math.max(0.25, Math.min(1, Math.pow(2, (15 - map.getZoom()) * 0.5)));
  turret.canvas.style.transformOrigin = "50% 62%";
  turret.canvas.style.transform = "scale(" + f + ")";
}

function basemapFromPage() {
  var name = new URLSearchParams(window.location.search).get("basemap");
  return name === "satellite" ? "satellite" : "osm";
}

function syncToggle(name) {
  if (!toggleRoot) return;
  var links = toggleRoot.getElementsByTagName("a");
  for (var i = 0; i < links.length; i++) {
    links[i].className = links[i].getAttribute("data-basemap") === name ? "active" : "";
  }
}

function applyBasemap(name, notify) {
  if (!map || !layers || !layers[name]) return;
  if (baseLayer !== layers[name]) {
    if (baseLayer) map.removeLayer(baseLayer);
    baseLayer = layers[name];
    baseLayer.addTo(map);
  }
  syncToggle(name);
  if (notify && bridge) bridge.basemapChanged(name);
}

function init() {
  if (typeof L === "undefined") {
    document.getElementById("offline").style.display = "block";
    return;
  }
  layers = {
    osm: L.tileLayer("tiles:/osm/{z}/{x}/{y}.png", {
      maxZoom: 19, attribution: "&copy; OpenStreetMap contributors"
    }),
    satellite: L.tileLayer("tiles:/satellite/{z}/{x}/{y}.jpg", {
      maxZoom: 19, maxNativeZoom: 14,
      attribution: '<a href="https://cloudless.eox.at">EOxCloudless</a> by EOX (Contains modified Copernicus Sentinel data 2016)'
    })
  };
  map = L.map("map", { zoomControl: true }).setView([31.5, 34.9], 8);
  var BasemapToggle = L.Control.extend({
    options: { position: "topright" },
    onAdd: function () {
      var div = L.DomUtil.create("div", "basemap-toggle");
      div.innerHTML = '<a href="#" data-basemap="osm">' + tr("map") + '</a><span>|</span>'
        + '<a href="#" data-basemap="satellite">' + tr("satellite") + '</a>';
      L.DomEvent.disableClickPropagation(div);
      L.DomEvent.disableScrollPropagation(div);
      L.DomEvent.on(div, "click", function (e) {
        var link = e.target;
        while (link && link !== div && !(link.getAttribute && link.getAttribute("data-basemap"))) {
          link = link.parentNode;
        }
        if (!link || link === div) return;
        L.DomEvent.preventDefault(e);
        applyBasemap(link.getAttribute("data-basemap"), true);
      });
      toggleRoot = div;
      return div;
    }
  });
  new BasemapToggle().addTo(map);
  applyBasemap(basemapFromPage(), false);
  map.on("zoomend", applyTurretScale);
  map.on("move zoom moveend zoomend", paintTurret);
  map.on("click", function (e) {
    if (drone && drone.options.draggable && bridge) {
      drone.setLatLng(e.latlng);
      bridge.droneMoved(e.latlng.lat, e.latlng.lng);
    }
  });
}

window.api = {
  setAntenna: function (lat, lon, zoom) {
    if (!map) return;
    if (!antenna) {
      if (!turret) turret = buildTurret();
      var ic = turret
        ? L.divIcon({ className: "ant3d", html: "", iconSize: [TS, TS], iconAnchor: [TS / 2, TS * 0.62] })
        : icon("ant-icon", "\uD83D\uDCE1");
      antenna = L.marker([lat, lon], { icon: ic, zIndexOffset: 500, interactive: false }).addTo(map);
      if (turret) {
        antenna.getElement().appendChild(turret.canvas);
        applyTurretScale();
        if (!turret.cur) setTurretPose(0, 0, 0, 90, 90);
        else turret.raf = turret.raf || requestAnimationFrame(turretStep);
      }
    }
    antenna.setLatLng([lat, lon]);
    if (zoom) map.setView([lat, lon], zoom);
  },
  setAntennaPose: function (refAz, az, el, pan, tilt) { setTurretPose(refAz, az, el, pan, tilt); },
  setSector: function (outerPts, innerPts) {
    if (!map) return;
    if (outer) map.removeLayer(outer);
    if (inner) map.removeLayer(inner);
    outer = L.polygon(outerPts, { color: "#35d07f", weight: 1, fillColor: "#35d07f", fillOpacity: 0.12 }).addTo(map);
    inner = L.polygon(innerPts, { color: "#35d07f", weight: 1, fillColor: "#35d07f", fillOpacity: 0.22 }).addTo(map);
  },
  setDrone: function (lat, lon, draggable) {
    if (!map) return;
    if (!drone) {
      drone = L.marker([lat, lon], { icon: droneIcon(), draggable: draggable, zIndexOffset: 1000 }).addTo(map);
      drone.on("drag dragend", function () {
        var p = drone.getLatLng();
        if (bridge) bridge.droneMoved(p.lat, p.lng);
      });
    } else if (!drone.dragging || !drone.dragging._draggable || !drone.dragging._draggable._moving) {
      drone.setLatLng([lat, lon]);
    }
  },
  setDroneLastKnown: function (on) {
    if (!drone) return;
    var el = drone.getElement();
    if (el) { el.style.filter = on ? "grayscale(1)" : ""; el.style.opacity = on ? "0.5" : ""; }
    if (on) drone.bindTooltip(tr("lastKnown"), { permanent: true, direction: "bottom" }).openTooltip();
    else drone.unbindTooltip();
  },
  setRecommended: function (pts) {
    if (!map) return;
    if (recLine) { map.removeLayer(recLine); recLine = null; }
    if (pts) recLine = L.polyline(pts, { color: "#4ea1ff", weight: 4, dashArray: "10 8" }).addTo(map);
  },
  setActual: function (pts) {
    if (!map) return;
    if (actLine) { map.removeLayer(actLine); actLine = null; }
    if (pts) actLine = L.polyline(pts, { color: "#35d07f", weight: 5 }).addTo(map);
  },
  setBasemap: function (name) {
    applyBasemap(name, false);
  }
};

init();
if (typeof qt !== "undefined" && typeof QWebChannel !== "undefined") {
  new QWebChannel(qt.webChannelTransport, function (channel) {
    bridge = channel.objects.bridge;
    bridge.mapReady();
  });
}
</script>
</body>
</html>
